name: Release

# main 에서 수동 실행 (버전 입력): 빌드 → Developer ID 서명 → DMG → Apple 공증 → stapler
#   → 업데이트 서명(appcast.xml) → 태그 · GitHub 릴리스 생성 + DMG/appcast 첨부
#   gh workflow run release.yml --ref main -f version=1.3.8
# 태그가 이미 있으면(웹에서 먼저 만든 릴리스 · 다시 빌드) 그 태그를 빌드한다.
# main 에서 실행하는 이유: 빌드 캐시(.build)를 main 에 저장해 다음 릴리스가 재사용한다 (태그에서 저장한 캐시는 다른 태그가 못 씀).
# 비밀 값은 `release` 환경의 Secrets 에만 있고, 환경 승인(사용자 확인) 후에만 실행된다.
# 테스트는 다시 돌리지 않는다 — main 의 코드는 PR 에서 이미 CI 를 통과했다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스할 버전 (VERSION 파일과 같아야 함, 예: 1.3.8)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      TAG: v${{ inputs.version }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - name: main 에서만 실행
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then echo "main 에서 실행하세요 (지금: $GITHUB_REF)"; exit 1; fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 태그가 있으면 그 커밋으로
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
            echo "TAG_EXISTS=1" >> "$GITHUB_ENV"
          fi
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 빌드 캐시 (main 기준 — 바뀐 부분만 다시 컴파일)
        uses: actions/cache@v6
        with:
          path: .build
          key: release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            release-${{ runner.os }}-

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 버전 확인 (입력 = VERSION 파일)
        run: |
          F="$(cat VERSION)"
          if [[ "$APP_VERSION" != "$F" ]]; then echo "입력한 버전 $APP_VERSION 와 VERSION 파일($F)이 달라요"; exit 1; fi

      - name: FreeTDS 설치 (SQL Server 드라이버)
        run: brew install freetds

      - name: 서명 인증서 · 공증 정보를 임시 키체인에
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials goddb --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          echo "NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | grep -c "Developer ID Application"

      - name: 빌드 · 서명 · DMG · 공증 · appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          swift package resolve
          ./scripts/make-dmg.sh
          test -f "build/GodDB-$APP_VERSION.dmg"
          test -f build/appcast.xml

      - name: 확인 (공증 · Homebrew 참조 · 회사 정보)
        run: |
          DMG="build/GodDB-$APP_VERSION.dmg"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          M=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$M" "$DMG" >/dev/null
          A="$M/GodDB.app"
          codesign --verify --deep --strict "$A"
          spctl -a -vv "$A"
          if (otool -L "$A/Contents/MacOS/GodDB"; find "$A/Contents/Frameworks" -name "*.dylib" -exec otool -L {} \;) | grep -q /opt/homebrew/; then
            echo "Homebrew 경로 참조가 남아 있어요"; exit 1
          fi
          if [[ -n "${{ secrets.FORBIDDEN_WORDS_REGEX }}" ]] && strings "$A/Contents/MacOS/GodDB" | grep -qiE "${{ secrets.FORBIDDEN_WORDS_REGEX }}"; then
            echo "금지 단어가 앱에 들어 있어요"; exit 1
          fi
          hdiutil detach "$M" >/dev/null

      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/GodDB-$APP_VERSION.dmg"
          # docs/FEATURES.md 의 "### X.Y.Z" 변경 이력 + 설치 안내
          ./scripts/release-notes.sh "$APP_VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # GitHub 웹에서 먼저 만든 릴리스: 파일을 붙이고, 변경 사항이 없으면 노트 맨 위에 넣는다
            gh release upload "$TAG" "$DMG" build/appcast.xml --clobber
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if ! grep -q '^## 변경 사항' <<<"$BODY" && grep -q '^## 변경 사항' "$RUNNER_TEMP/notes.md"; then
              { sed '/^## 설치/,$d' "$RUNNER_TEMP/notes.md"; printf '%s\n' "$BODY"; } > "$RUNNER_TEMP/merged.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/merged.md"
            fi
          else
            # 태그가 없으면 빌드한 커밋에 만든다
            gh release create "$TAG" "$DMG" build/appcast.xml --target "$BUILD_SHA" --title "GodDB $APP_VERSION" \
              --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: 임시 키체인 정리
        if: always()
        run: |
          [[ -n "$NOTARY_KEYCHAIN" ]] && security delete-keychain "$NOTARY_KEYCHAIN" || true
